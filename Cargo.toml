[workspace]
resolver = "2"
members = [
    "crates/dng-core",
    "crates/dng-jpeg",
    "crates/dng-jxl",
    "crates/dng-xmp",
    "crates/dng-sdk",
    "crates/dng-validate",
]

[workspace.package]
version = "1.7.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

[workspace.dependencies]
half = "2"
flate2 = { version = "1", default-features = true }   # rust/miniz_oxide backend
crc32fast = "1"
quick-xml = "0.37"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
jxl-oxide = "0.11"
